# Calibrated config for 2D thermal cases derived from OpenFOAM oneBlock_cyclic sweep.
# Sweep findings (scripts/sweep_decision_core_openfoam_case.py, 2026-04-06):
#   min_critical_fraction=0.02 gives lowest runtime with stable MAE (~1.47e-4).
#   Steps reduced to 80 (2/5 of default 200) matches OpenFOAM convergence horizon.
#   Grid aligned to actual OpenFOAM case geometry (60x50 instead of generic sqrt(N)).

# --- Grid ---
grid_x: 60
grid_y: 50
grid_z: 1

# --- Time integration ---
steps: 80
dt: 0.001
alpha: 1.0

# --- Solver tolerances ---
coarse_tolerance: 0.05
fine_tolerance: 0.03

# --- Decision core (calibrated) ---
decision_policy: heuristic
refine_local_error_tau: 0.05
refine_uncertainty_tau: 0.20
min_critical_fraction: 0.02

# --- Guardrails ---
memory_ceiling_gb: 16
wallclock_limit_minutes: 0
halo_overhead_ratio_max: 0.95

# --- Reproducibility ---
deterministic_mode: true
partitioning_policy: strict_geometric

# --- Training data export ---
export_training_data: false
